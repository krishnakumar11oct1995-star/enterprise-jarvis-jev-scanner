<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#0a1526"/>
    </linearGradient>
    <linearGradient id="radarCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bg)"/>
  <rect x="25" y="25" width="450" height="450" rx="85" fill="none" stroke="#102038" stroke-width="3"/>
  <!-- Holographic Concentric Rings -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="250" cy="250" r="120" fill="none" stroke="#00F0FF" stroke-width="4" opacity="0.6"/>
  <circle cx="250" cy="250" r="75" fill="none" stroke="#0080FF" stroke-width="5" opacity="0.8"/>
  <circle cx="250" cy="250" r="30" fill="url(#radarCyan)" filter="url(#glow)"/>
  <!-- Crosshairs -->
  <line x1="250" y1="70" x2="250" y2="430" stroke="#00F0FF" stroke-width="2" opacity="0.5"/>
  <line x1="70" y1="250" x2="430" y2="250" stroke="#00F0FF" stroke-width="2" opacity="0.5"/>
  <!-- Radar Sweep Beam (Wedge) -->
  <path d="M 250 250 L 360 140 A 160 160 0 0 0 250 90 Z" fill="url(#radarCyan)" opacity="0.3" filter="url(#glow)"/>
  <!-- Target Blip Nodes (Conflict Radar Hits) -->
  <circle cx="320" cy="190" r="8" fill="#FF0055" filter="url(#glow)"/>
  <circle cx="180" cy="310" r="7" fill="#10B981" filter="url(#glow)"/>
</svg>
